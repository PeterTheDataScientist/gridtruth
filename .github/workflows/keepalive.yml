name: keepalive

# GitHub disables scheduled workflows after 60 days of repository inactivity.
# On a project whose whole value is an uninterrupted time series, that is a
# silent, total failure. This keeps the repo active.

on:
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%dT%H:%MZ > .keepalive
          git config user.name "gridwatch-bot"
          git config user.email "noreply@github.com"
          git add .keepalive
          git diff --staged --quiet || git commit -m "chore: keepalive"
          git push
