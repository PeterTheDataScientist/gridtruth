name: ingest

on:
  schedule:
    # Odd minutes on purpose. Scheduled runs at the top of the hour are queued
    # across all of GitHub and can drift by 30 minutes or more.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test before writing
        # A parser regression must not be allowed to append garbage to the
        # public dataset. Tests gate the write, not the other way round.
        run: pytest -q

      - name: Ingest
        id: ingest
        run: python -m gridwatch --once | tee run-report.json

      - name: Commit new records
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "no new data"
            exit 0
          fi
          git config user.name "gridwatch-bot"
          git config user.email "noreply@github.com"
          git add data/
          git commit -m "data: ingest $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-report-${{ github.run_id }}
          path: run-report.json
          retention-days: 30

      - name: Heartbeat
        # A silently dead cron is the most common way a project like this ends.
        # This fires only on success, so a missed beat raises an alert.
        if: success() && env.HEARTBEAT_URL != ''
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: curl -fsS --max-time 10 "$HEARTBEAT_URL" || true
